name: contribution-skyline

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0" # weekly (Sunday 00:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  skyline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate 3D contribution skyline
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.skyline.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ""
          plugin_skyline: yes
          plugin_skyline_year: current
          config_timezone: Africa/Nairobi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics.skyline.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: update contribution skyline"
            git push
          fi
