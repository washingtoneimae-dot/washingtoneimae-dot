name: contribution-skyline

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0" # weekly (Sunday 00:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  skyline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate 3D contribution skyline
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.skyline.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: main
          base: ""
          plugin_skyline: yes
          plugin_skyline_year: 2026
          plugin_skyline_frames: 8
          plugin_skyline_quality: 0.25
          config_timezone: Africa/Nairobi
